[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "24"
# Public browser configuration only. RLS protects data; no administrative key belongs here.
VITE_SUPABASE_URL = "https://iumnzmiebrykwyttdqmu.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QChtGcheYjWcuv1ze6MxtA_P85LbblR"
VITE_SITE_URL = "https://studio-hardkick.joaopedrocoelhosilva14.workers.dev"
[[redirects]]
from = "/professores.html"
to = "/professores"
status = 301
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
for = "/admin"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store"
